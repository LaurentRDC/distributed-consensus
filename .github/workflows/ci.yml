name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/run-ormolu@v18
        with:
          mode: check

  # Enable linting when the repository is public
  # linting:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     security-events: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: haskell-actions/hlint-scan@v1
  #       with:
  #         fail-on: note

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
          - '9.6'
          - '9.8'
          - '9.10'
          - '9.12'
          - '9.14'

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Configure build
        run: |
          cabal configure --disable-optimization --semaphore -j
          # Generate a plan.json
          cabal build all --dry-run

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/plan.json') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies

      - name: Build libraries
        run: cabal build all

      - name: Run tests
        run: |
          # Github Actions hosted runners don't have that much RAM,
          # which can make some tests appear to fail due to the test executable
          # being killed.
          #
          # Therefore, the amount of exploration is capped to about 1/5 of the
          # default values
          cabal test all --test-options="--quickcheck-tests=1000 --schedule-bound=20 --branching-factor=2"
